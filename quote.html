<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Your cleaning quote</title><style>
body{font:18px/1.6 system-ui,sans-serif;color:#123e38;background:#e7f0ef;margin:0}main{max-width:600px;margin:32px auto;padding:24px;background:#fffdf8;border-radius:20px}h1{line-height:1.2}button{font:inherit;background:#176b5b;color:white;border:0;border-radius:12px;padding:14px 20px;margin:12px 8px 12px 0;cursor:pointer}button:disabled{opacity:.5}li{margin:14px 0}#error{color:#a32020}#cancel{background:#8c2929}label{display:block}input{width:22px;height:22px}footer{font-size:14px} @media(max-width:650px){main{margin:12px}}
</style></head><body><main><h1 id="heading">Your quote</h1><p id="state" role="status">Loading your quote…</p><div id="details"></div><form id="choice" hidden><label><input id="agree" type="checkbox" required> <span id="agreement">I have reviewed the work, amount and terms and accept this quote.</span></label><button id="accept" type="submit">Accept quote</button><button id="cancel" type="submit" hidden>Cancel acceptance</button></form><p id="error" role="alert"></p><footer>Cancelling acceptance does not cancel a scheduled clean. Contact your cleaner about any booked appointment.</footer></main>
<script>
const endpoint='https://alnvhibqmkxogwtdyskp.supabase.co/functions/v1/quote-response';
const token=new URLSearchParams(location.hash.slice(1)).get('t');let current,busy=false;
const el=id=>document.getElementById(id);
async function call(action){const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,action,confirm:action!=='review'})});const d=await r.json();if(!r.ok||d.error)throw Error(d.error||'Could not load the quote.');return d;}
function render(d){current=d;el('details').replaceChildren();el('heading').textContent=`${d.business} · ${d.number}`;el('state').textContent=d.status==='accepted'?'Quote accepted. Thank you!':d.status==='declined'?(d.events.some(e=>e.kind==='cancelled')?'Acceptance cancelled. Contact your cleaner to discuss next steps.':'This quote has been declined. Contact your cleaner to discuss next steps.'):'Review your quote below.';
 const list=document.createElement('ul');let subtotal=0;for(const l of d.lines){const item=document.createElement('li');item.textContent=`${l.description} — ${l.quantity} × ${d.currency} ${(l.unit_minor/100).toFixed(2)}`;list.append(item);subtotal+=l.quantity*l.unit_minor;}el('details').append(list);
 for(const text of [`Total: ${d.currency} ${((subtotal+Math.floor((subtotal*d.tax_bps+5000)/10000))/100).toFixed(2)}`,`Valid until: ${d.valid_until}`,d.terms||'']){const p=document.createElement('p');p.textContent=text;el('details').append(p);}
 el('choice').hidden=!['issued','accepted'].includes(d.status);el('accept').hidden=d.status!=='issued';el('cancel').hidden=d.status!=='accepted';el('agreement').textContent=d.status==='accepted'?'I want to cancel my acceptance of this quote.':'I have reviewed the work, amount and terms and accept this quote.';el('agree').checked=false;
}
el('choice').addEventListener('submit',async e=>{e.preventDefault();if(busy||!el('agree').checked)return;busy=true;el('accept').disabled=el('cancel').disabled=true;el('error').textContent='';try{render(await call(current.status==='accepted'?'cancel':'accept'));}catch(e){el('error').textContent=e.message;}finally{busy=false;el('accept').disabled=el('cancel').disabled=false;}});
if(!token){el('state').textContent='This link is missing. Open the link from your quote email.';}else{call('review').then(render).catch(e=>{el('state').textContent='Quote unavailable';el('error').textContent=e.message;});}
</script></body></html>
